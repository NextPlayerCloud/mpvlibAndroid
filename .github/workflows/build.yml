name: build

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-check:
    name: Verify Upstream Patches
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dry-run mpv and FFmpeg patches
        run: |
          set -euxo pipefail
          source buildscripts/include/depinfo.sh

          git clone --depth 1 --branch fongmi https://github.com/FongMi/mpv.git /tmp/mpv-check
          for p in mpv_video_shaders.patch mpv_android_fdsan_fork.patch mpv_lsfg_layer.patch mpv_android_font_cache.patch mpv_gpu_osd_vao_init.patch; do
            git -C /tmp/mpv-check apply --check "$GITHUB_WORKSPACE/buildscripts/patches/$p"
          done

          git clone --depth 1 --branch "$v_ci_ffmpeg" https://github.com/FongMi/FFmpeg.git /tmp/ffmpeg-check
          git -C /tmp/ffmpeg-check apply --check "$GITHUB_WORKSPACE/buildscripts/patches/ffmpeg_force_mpegts.patch"

  build:
    name: Build Android AAR
    needs: patch-check
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      MPV_GIT_URL: https://github.com/FongMi/mpv.git
      MPV_GIT_REF: fongmi
      FFMPEG_GIT_URL: https://github.com/FongMi/FFmpeg.git
      LIBPLACEBO_GIT_URL: https://github.com/FongMi/libplacebo.git

      CACHE_MODE: folder
      CACHE_FOLDER: ${{ github.workspace }}/gh-cache
      LIBPLACEBO_CACHE_FOLDER: ${{ github.workspace }}/gh-libplacebo-cache

      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPRESS: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_DISABLE: "true"

      GRADLE_OPTS: >-
        -Xmx4G
        -Dorg.gradle.daemon=false
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configureondemand=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Semantic Version
        run: |
          bash buildscripts/version.sh validate
          echo "VERSION_NAME=$(bash buildscripts/version.sh name)" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Export CI environment variables
        run: |
          buildscripts/include/ci.sh export >> "$GITHUB_ENV"

      - name: Restore Android SDK cache
        id: android-sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: buildscripts/sdk/
          key: android-sdk-${{ runner.os }}-${{ hashFiles('buildscripts/include/depinfo.sh', 'buildscripts/include/download-sdk.sh') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Restore native prefix cache
        id: native-prefix-cache
        uses: actions/cache/restore@v6
        with:
          path: gh-cache/
          key: native-prefix-${{ runner.os }}-${{ env.CACHE_IDENTIFIER }}
          restore-keys: |
            native-prefix-${{ runner.os }}-

      - name: Restore libplacebo cache
        id: libplacebo-cache
        uses: actions/cache/restore@v6
        with:
          path: gh-libplacebo-cache/
          key: libplacebo-${{ runner.os }}-${{ env.LIBPLACEBO_CACHE_IDENTIFIER }}

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache/
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            ant \
            automake \
            build-essential \
            ccache \
            gcc g++ \
            gcc-multilib \
            libc6-dev-i386 \
            cmake \
            gettext \
            gperf \
            libtool \
            nasm \
            ninja-build \
            pkg-config \
            patch \
            python3 \
            python3-pip \
            unzip \
            wget

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade meson jinja2 jsonschema

      - name: Download and restore native dependencies
        run: |
          set -euxo pipefail
          mkdir -p "$CACHE_FOLDER" "$LIBPLACEBO_CACHE_FOLDER"
          buildscripts/include/ci.sh install

      - name: Save Android SDK cache
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: buildscripts/sdk/
          key: android-sdk-${{ runner.os }}-${{ hashFiles('buildscripts/include/depinfo.sh', 'buildscripts/include/download-sdk.sh') }}

      - name: Save native prefix cache
        if: steps.native-prefix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: gh-cache/
          key: native-prefix-${{ runner.os }}-${{ env.CACHE_IDENTIFIER }}

      - name: Save libplacebo cache
        if: steps.libplacebo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: gh-libplacebo-cache/
          key: libplacebo-${{ runner.os }}-${{ env.LIBPLACEBO_CACHE_IDENTIFIER }}

      - name: Show ccache stats before build
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      - name: Build AAR for all Android architectures
        run: |
          set -euxo pipefail

          unset ANDROID_SDK_ROOT

          cd buildscripts

          source include/build_config.sh
          arches=(armv7l arm64)
          [ "$ENABLE_X86_ARCH" = "true" ] && arches+=(x86 x86_64)
          for arch in "${arches[@]}"; do
            ./buildall.sh --arch "$arch" -n mpv
          done

          ./buildall.sh -n mpv-android

      - name: Verify 16KB ELF page alignment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, subprocess, sys

          so_files = sorted(glob.glob("app/src/main/libs/*/*.so"))
          if not so_files:
              print("No .so files found under app/src/main/libs", file=sys.stderr)
              sys.exit(1)

          # Google Play / Android 15+ 16KB page size requirement applies to 64-bit ABIs.
          # 32-bit NDK prebuilt libc++_shared.so and ndk-build defaults use 4KB (0x1000).
          require_16kb_abis = {"arm64-v8a", "x86_64"}

          failed = False
          for so in so_files:
              abi = os.path.basename(os.path.dirname(so))
              min_required = 0x4000 if abi in require_16kb_abis else 0x1000
              out = subprocess.check_output(["readelf", "-lW", so], text=True)
              aligns = []
              for line in out.splitlines():
                  parts = line.split()
                  if parts and parts[0] == "LOAD":
                      align = int(parts[-1], 16)
                      aligns.append(align)
                      if align < min_required:
                          print(f"FAIL {so}: PT_LOAD align {hex(align)} < {hex(min_required)}", file=sys.stderr)
                          failed = True
              if not aligns:
                  print(f"FAIL {so}: no PT_LOAD segments found", file=sys.stderr)
                  failed = True
              else:
                  print(f"OK   {so}: min PT_LOAD align = {hex(min(aligns))}")

          if failed:
              sys.exit(1)
          PY

      - name: Export renderer SDK
        run: buildscripts/export-renderer-sdk.sh

      - name: Setup Java 8 for BD-J
        uses: actions/setup-java@v6
        with:
          java-version: "8"
          distribution: temurin

      - name: Build matching BD-J jars
        run: bash buildscripts/build-bdj-jars.sh

      - name: Upload BD-J artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libbluray-bdj
          path: |
            buildscripts/build/bdj/libbluray-*.jar
            buildscripts/prefix/arm64/lib/libbluray.a
            buildscripts/prefix/armv7l/lib/libbluray.a
            buildscripts/prefix/arm64/lib/libfreetype.a
            buildscripts/prefix/armv7l/lib/libfreetype.a
          if-no-files-found: error

      - name: Upload renderer SDK
        uses: actions/upload-artifact@v7
        with:
          name: mpvlib-fongmi-renderer-sdk
          path: build/renderer-sdk/**
          if-no-files-found: error

      - name: Show ccache stats after build
        if: always()
        run: |
          ccache --show-stats || true

      - name: Save ccache
        if: always() && steps.ccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ccache/
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Stage AAR artifact
        run: |
          set -euxo pipefail

          mkdir -p dist

          AAR_PATH="app/build/outputs/aar/app-release.aar"

          if [ ! -f "$AAR_PATH" ]; then
            echo "AAR file not found at: $AAR_PATH"
            find app/build/outputs -type f || true
            exit 1
          fi

          cp "$AAR_PATH" "dist/mpvlib-fongmi.aar"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpvlib-fongmi
          path: dist/mpvlib-fongmi.aar
          if-no-files-found: error
