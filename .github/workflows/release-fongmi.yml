name: release-fongmi

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing SemVer tag, for example v1.0.0"
        required: true
        type: string
      draft:
        description: "Create release as draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-fongmi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version_tag: ${{ steps.tag.outputs.version_tag }}
      version_name: ${{ steps.sources.outputs.version_name }}
      version_code: ${{ steps.sources.outputs.version_code }}
      fongmi_sha: ${{ steps.sources.outputs.fongmi_sha }}

    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="${{ inputs.release_tag }}"
          fi

          if [[ -z "$VERSION_TAG" ]]; then
            echo "Release tag is empty."
            exit 1
          fi

          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.version_tag }}

      - name: Resolve version metadata
        id: sources
        env:
          VERSION_TAG: ${{ steps.tag.outputs.version_tag }}
        run: |
          set -euo pipefail

          bash buildscripts/version.sh validate-tag "$VERSION_TAG"

          echo "version_name=$(bash buildscripts/version.sh name)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(bash buildscripts/version.sh code)" >> "$GITHUB_OUTPUT"
          echo "fongmi_sha=$(git rev-list -n 1 "$VERSION_TAG")" >> "$GITHUB_OUTPUT"

  build:
    name: Build FongMi AAR
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      CACHE_MODE: folder
      CACHE_FOLDER: ${{ github.workspace }}/gh-cache

      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPRESS: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_DISABLE: "true"

      GRADLE_OPTS: >-
        -Xmx4G
        -Dorg.gradle.daemon=false
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configureondemand=true

    steps:
      - name: Checkout FongMi source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.fongmi_sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export CI environment variables
        run: buildscripts/include/ci.sh export >> "$GITHUB_ENV"

      - name: Restore Android SDK cache
        id: android-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: buildscripts/sdk/
          key: android-sdk-${{ runner.os }}-${{ hashFiles('buildscripts/include/depinfo.sh', 'buildscripts/include/download-sdk.sh') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Restore native prefix cache
        id: native-prefix-cache
        uses: actions/cache/restore@v4
        with:
          path: gh-cache/
          key: native-prefix-${{ runner.os }}-${{ env.CACHE_IDENTIFIER }}
          restore-keys: |
            native-prefix-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache/
          key: ccache-${{ runner.os }}-mpv-fongmi-${{ needs.prepare.outputs.fongmi_sha }}
          restore-keys: |
            ccache-${{ runner.os }}-mpv-fongmi-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            ant \
            automake \
            build-essential \
            ccache \
            cmake \
            gcc g++ \
            gettext \
            gperf \
            libtool \
            nasm \
            ninja-build \
            pkg-config \
            patch \
            python3 \
            python3-pip \
            unzip \
            wget \
            zip

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade meson jinja2 jsonschema

      - name: Download and restore native dependencies
        run: |
          set -euxo pipefail
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install

      - name: Save Android SDK cache
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: buildscripts/sdk/
          key: android-sdk-${{ runner.os }}-${{ hashFiles('buildscripts/include/depinfo.sh', 'buildscripts/include/download-sdk.sh') }}

      - name: Save native prefix cache
        if: steps.native-prefix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gh-cache/
          key: native-prefix-${{ runner.os }}-${{ env.CACHE_IDENTIFIER }}

      - name: Build release AAR for all Android architectures
        run: |
          set -euxo pipefail
          unset ANDROID_SDK_ROOT
          cd buildscripts

          source include/build_config.sh
          arches=(armv7l arm64)
          [ "$ENABLE_X86_ARCH" = "true" ] && arches+=(x86 x86_64)
          for arch in "${arches[@]}"; do
            ./buildall.sh --arch "$arch" -n mpv
          done

          ./buildall.sh -n mpv-android

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Save ccache
        if: always() && steps.ccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache/
          key: ccache-${{ runner.os }}-mpv-fongmi-${{ needs.prepare.outputs.fongmi_sha }}

      - name: Stage mpvlib-fongmi release files
        run: |
          set -euxo pipefail

          ARTIFACT_BASE="mpvlib-fongmi"
          AAR_PATH="app/build/outputs/aar/app-release.aar"
          RELEASE_AAR="dist/${ARTIFACT_BASE}-${VERSION_NAME}.aar"
          mkdir -p dist

          if [ ! -f "$AAR_PATH" ]; then
            echo "AAR file not found at: $AAR_PATH"
            find app/build/outputs -type f || true
            exit 1
          fi

          cp "$AAR_PATH" "$RELEASE_AAR"
          (cd dist && sha256sum "${ARTIFACT_BASE}-${VERSION_NAME}.aar" > "${ARTIFACT_BASE}-${VERSION_NAME}.aar.sha256")

      - name: Upload mpvlib-fongmi release files
        uses: actions/upload-artifact@v4
        with:
          name: release-fongmi
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish FongMi release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      VERSION_NAME: ${{ needs.prepare.outputs.version_name }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.fongmi_sha }}

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-fongmi
          path: dist

      - name: Verify release files
        run: |
          set -euo pipefail

          expected=(
            "mpvlib-fongmi-${VERSION_NAME}.aar"
          )

          for file in "${expected[@]}"; do
            test -s "dist/$file"
            test -s "dist/$file.sha256"
            (cd dist && sha256sum -c "$file.sha256")
          done

      - name: Generate release notes
        env:
          FONGMI_SHA: ${{ needs.prepare.outputs.fongmi_sha }}
        run: |
          set -euo pipefail

          RELEASE_NOTES="dist/release-notes-${VERSION_TAG}.md"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${VERSION_TAG}^" 2>/dev/null || true)"

          {
            echo "# mpvlib-fongmi ${VERSION_TAG}"
            echo ""
            echo "## AAR"
            echo ""
            echo "- \`mpvlib-fongmi-${VERSION_NAME}.aar\`: FongMi native profile"
            echo ""
            echo "Consume it straight from GitHub Releases with an Ivy repository:"
            echo ""
            echo '```kotlin'
            echo "ivy {"
            echo "  name = \"mpvlibGitHubReleases\""
            echo "  url = uri(\"https://github.com/${GITHUB_REPOSITORY}/releases/download\")"
            echo "  patternLayout {"
            echo "    artifact(\"v[revision]/[artifact]-[revision].[ext]\")"
            echo "  }"
            echo "  metadataSources { artifact() }"
            echo "}"
            echo '```'
            echo ""
            echo "Each AAR has a matching \`.sha256\` checksum file."
            echo ""
            echo "## Included Android ABIs"
            echo ""
            echo "- \`armeabi-v7a\`"
            echo "- \`arm64-v8a\`"
            echo "- \`x86\`"
            echo "- \`x86_64\`"
            echo ""
            echo "## Source commit"
            echo ""
            echo "- \`mpv-fongmi\`: \`${FONGMI_SHA}\`"
            echo ""
            echo "## Checksums"
            echo ""
            echo '```text'
            cat dist/*.sha256
            echo '```'
            echo ""
            echo "## Commit history"
            echo ""

            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "Changes from \`${PREVIOUS_TAG}\` to \`${VERSION_TAG}\`:"
              echo ""
              git log \
                --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H)) by %an" \
                "${PREVIOUS_TAG}..${VERSION_TAG}"
            else
              git log \
                --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H)) by %an" \
                "$VERSION_TAG"
            fi
            echo ""
          } > "$RELEASE_NOTES"

          cat "$RELEASE_NOTES"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvlib-fongmi-${{ env.VERSION_NAME }}
          path: |
            dist/*.aar
            dist/*.sha256
            dist/release-notes-${{ env.VERSION_TAG }}.md
          if-no-files-found: error

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: mpvlib-fongmi ${{ env.VERSION_TAG }}
          body_path: dist/release-notes-${{ env.VERSION_TAG }}.md
          files: |
            dist/*.aar
            dist/*.sha256
            dist/release-notes-${{ env.VERSION_TAG }}.md
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
